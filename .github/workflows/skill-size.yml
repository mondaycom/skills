name: Skill size

# Clients cap how much of a skill they load or accept, so a skill over a limit is silently
# truncated or rejected. Keep every SKILL.md under the strictest limit; move detail into references/.
#   - Google Antigravity loads only the first 24,000 bytes of SKILL.md.
#   - Google's Gemini partner plugin scanner rejects a SKILL.md over 500 lines or with a body
#     (everything after the frontmatter) of 3,000 words or more.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skill-size:
    name: SKILL.md size limit
    runs-on: ubuntu-latest
    env:
      MAX_BYTES: 24000
      MAX_LINES: 500
      MAX_WORDS: 3000
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md sizes
        run: |
          status=0
          for file in skills/*/SKILL.md; do
            bytes=$(wc -c < "$file")
            lines=$(wc -l < "$file")
            words=$(awk '/^---$/{n++; next} n>=2' "$file" | wc -w)
            if [ "$bytes" -gt "$MAX_BYTES" ] || [ "$lines" -gt "$MAX_LINES" ] || [ "$words" -ge "$MAX_WORDS" ]; then
              echo "::error file=$file::$file is $bytes bytes, $lines lines, $words words (max $MAX_BYTES bytes, $MAX_LINES lines, under $MAX_WORDS words). Move reference detail into references/."
              status=1
            else
              echo "ok  $file ($bytes bytes, $lines lines, $words words)"
            fi
          done
          exit $status
